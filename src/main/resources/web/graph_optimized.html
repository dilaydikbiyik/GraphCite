<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphCite - Optimize</title>
    <!-- Force-Graph: Canvas tabanlı, maksimum performans -->
    <script src="https://unpkg.com/force-graph@1.43.4/dist/force-graph.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: #0f172a;
        overflow: hidden;
      }
      #graph-container {
        width: 100vw;
        height: 100vh;
        position: relative;
      }
      .tooltip {
        position: absolute;
        padding: 12px;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid #334155;
        border-radius: 8px;
        color: #f8fafc;
        font-size: 12px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s;
        z-index: 1000;
      }
      .tooltip.visible {
        opacity: 1;
      }
      .stats-panel {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 16px;
        color: #f8fafc;
        min-width: 220px;
        z-index: 100;
      }
      .stats-title {
        color: #60a5fa;
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 12px;
      }
      .stat-item {
        display: flex;
        justify-content: space-between;
        margin: 6px 0;
      }
      .stat-label {
        color: #94a3b8;
      }
      .stat-value {
        color: #10b981;
        font-weight: bold;
      }
      .legend {
        position: absolute;
        top: 80px;
        left: 20px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 12px;
        font-size: 11px;
        color: #94a3b8;
        z-index: 100;
      }
      .legend-item {
        display: flex;
        align-items: center;
        margin: 4px 0;
      }
      .legend-color {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-right: 8px;
      }
      .legend-line {
        width: 20px;
        height: 2px;
        margin-right: 8px;
      }
    </style>
  </head>
  <body>
    <div id="graph-container">
      <div id="graph"></div>
      <div class="tooltip" id="tooltip"></div>

      <div class="legend">
        <div class="legend-item">
          <div class="legend-color" style="background: #3b82f6"></div>
          <span>Normal</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #facc15"></div>
          <span>Seçili</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #ef4444"></div>
          <span>H-Core</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #22c55e"></div>
          <span>Yeni Eklenen</span>
        </div>
        <div class="legend-item">
          <div class="legend-line" style="background: #64748b"></div>
          <span>Referans (Siyah)</span>
        </div>
        <div class="legend-item">
          <div class="legend-line" style="background: #10b981"></div>
          <span>Timeline (Yeşil)</span>
        </div>
      </div>

      <div class="stats-panel">
        <div class="stats-title">📊 Graf İstatistikleri</div>
        <div class="stat-item">
          <span class="stat-label">Toplam Makale:</span
          ><span class="stat-value" id="statNodes">-</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Toplam Referans (Siyah):</span
          ><span class="stat-value" id="statEdges">-</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Verilen Referans:</span
          ><span class="stat-value" id="statOutRefs">-</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Alınan Referans:</span
          ><span class="stat-value" id="statInRefs">-</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">En Çok Atıf Alan:</span
          ><span class="stat-value" id="statTopCited">-</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">En Çok Atıf Veren:</span
          ><span class="stat-value" id="statTopReferencer">-</span>
        </div>
      </div>
    </div>

    <script>
      let graph = null;
      let graphData = { nodes: [], links: [] };
      let allData = []; // Tüm makale verisi
      let selectedNode = null;
      let hcoreNodes = new Set();
      let newlyAddedNodes = new Set();

      const COLORS = {
        node: "#3b82f6",
        selected: "#facc15",
        hcore: "#ef4444",
        newlyAdded: "#22c55e",
        linkReference: "#64748b",
        linkTimeline: "#10b981",
      };

      function initGraph() {
        graph = ForceGraph()(document.getElementById("graph"))
          .width(window.innerWidth)
          .height(window.innerHeight)
          .backgroundColor("#0f172a")
          .nodeRelSize(4)
          .nodeVal((node) => Math.sqrt(node.citationCount + 1) * 2)
          .nodeColor((node) => {
            if (newlyAddedNodes.has(node.id)) return COLORS.newlyAdded;
            if (node.id === selectedNode?.id) return COLORS.selected;
            if (hcoreNodes.has(node.id)) return COLORS.hcore;
            return COLORS.node;
          })
          .nodeCanvasObject((node, ctx, globalScale) => {
            const size = Math.sqrt(node.citationCount + 1) * 3 + 4;
            let color = COLORS.node;
            if (newlyAddedNodes.has(node.id)) color = COLORS.newlyAdded;
            else if (node.id === selectedNode?.id) color = COLORS.selected;
            else if (hcoreNodes.has(node.id)) color = COLORS.hcore;

            ctx.beginPath();
            ctx.arc(node.x, node.y, size, 0, 2 * Math.PI);
            ctx.fillStyle = color;
            ctx.fill();

            // Atıf sayısı
            if (node.citationCount > 0 && globalScale > 0.3) {
              ctx.font = `bold ${Math.max(8 / globalScale, 2)}px Segoe UI`;
              ctx.textAlign = "center";
              ctx.textBaseline = "bottom";
              ctx.fillStyle = "#fbbf24";
              ctx.fillText(node.citationCount, node.x, node.y - size - 2);
            }
          })
          .nodeCanvasObjectMode(() => "replace")
          .linkColor((link) =>
            link.type === "timeline"
              ? COLORS.linkTimeline
              : COLORS.linkReference
          )
          .linkWidth((link) => (link.type === "timeline" ? 1.5 : 0.5))
          .linkDirectionalArrowLength((link) =>
            link.type === "reference" ? 4 : 0
          )
          .linkDirectionalArrowRelPos(1)
          .onNodeHover(handleNodeHover)
          .onNodeClick(handleNodeClick);
      }

      function handleNodeHover(node) {
        if (node) showTooltip(node);
        else hideTooltip();
      }

      function handleNodeClick(node) {
        selectedNode = node;
        if (window.javaConnector) {
          window.javaConnector.onNodeClicked(node.id);
        }
        graph.nodeColor(graph.nodeColor());
      }

      function showTooltip(node) {
        const tooltip = document.getElementById("tooltip");
        const authors =
          node.authors?.length > 0
            ? node.authors.slice(0, 3).join(", ")
            : "Bilinmiyor";
        tooltip.innerHTML = `
          <div style="color:#60a5fa;font-weight:bold;margin-bottom:8px;">${
            node.title || "Başlık Yok"
          }</div>
          <div><span style="color:#94a3b8;">ID:</span> ${node.id}</div>
          <div><span style="color:#94a3b8;">Yıl:</span> ${
            node.year || "-"
          }</div>
          <div><span style="color:#94a3b8;">Yazarlar:</span> ${authors}</div>
          <div><span style="color:#94a3b8;">Atıf Sayısı:</span> <span style="color:#10b981;font-weight:bold;">${
            node.citationCount || 0
          }</span></div>
        `;
        tooltip.classList.add("visible");
        document.addEventListener("mousemove", updateTooltipPosition);
      }

      function updateTooltipPosition(e) {
        const tooltip = document.getElementById("tooltip");
        tooltip.style.left = e.clientX + 15 + "px";
        tooltip.style.top = e.clientY - 10 + "px";
      }

      function hideTooltip() {
        document.getElementById("tooltip").classList.remove("visible");
        document.removeEventListener("mousemove", updateTooltipPosition);
      }

      function loadGraphData(jsonData) {
        const data =
          typeof jsonData === "string" ? JSON.parse(jsonData) : jsonData;
        allData = data;
        processData(data);
      }

      function processData(data) {
        const nodeMap = new Map();
        data.forEach((m) => nodeMap.set(m.id, m));

        // Atıf sayılarını hesapla
        const citationCounts = new Map();
        data.forEach((m) => citationCounts.set(m.id, 0));
        data.forEach((m) => {
          if (m.referenced_works) {
            m.referenced_works.forEach((refId) => {
              if (citationCounts.has(refId))
                citationCounts.set(refId, citationCounts.get(refId) + 1);
            });
          }
        });

        graphData.nodes = data.map((m) => ({
          id: m.id,
          title: m.title || "",
          year: m.year || 0,
          authors: m.authors || [],
          doi: m.doi || "",
          citationCount: citationCounts.get(m.id) || 0,
          outDegree: m.referenced_works ? m.referenced_works.length : 0,
          referencedWorks: m.referenced_works || [],
        }));

        graphData.links = [];

        // Referans kenarları (siyah)
        data.forEach((m) => {
          if (m.referenced_works) {
            m.referenced_works.forEach((refId) => {
              if (nodeMap.has(refId)) {
                graphData.links.push({
                  source: m.id,
                  target: refId,
                  type: "reference",
                });
              }
            });
          }
        });

        // Timeline kenarları (yeşil - ID sırasına göre)
        const sortedNodes = [...graphData.nodes].sort((a, b) => {
          const n1 = parseInt(a.id.replace(/\D/g, "")) || 0;
          const n2 = parseInt(b.id.replace(/\D/g, "")) || 0;
          return n1 - n2;
        });
        for (let i = 0; i < sortedNodes.length - 1; i++) {
          graphData.links.push({
            source: sortedNodes[i].id,
            target: sortedNodes[i + 1].id,
            type: "timeline",
          });
        }

        updateStats();
        if (!graph) initGraph();
        graph.graphData(graphData);
      }

      function showHCoreResults(hIndex, hMedian, hcoreIds) {
        if (!selectedNode || !hcoreIds) return;

        hcoreNodes = new Set(hcoreIds);
        newlyAddedNodes.clear();

        // Yeni düğümleri bul ve ekle
        const existingNodeIds = new Set(graphData.nodes.map((n) => n.id));
        const nodesToAdd = [];

        hcoreIds.forEach((id) => {
          if (!existingNodeIds.has(id)) {
            const makale = allData.find((m) => m.id === id);
            if (makale) {
              nodesToAdd.push(makale);
              newlyAddedNodes.add(id);
            }
          }
        });

        if (nodesToAdd.length > 0) {
          console.log(
            `✅ ${nodesToAdd.length} yeni h-core düğümü ekleniyor...`
          );
          processData([
            ...allData.filter(
              (m) =>
                existingNodeIds.has(m.id) ||
                nodesToAdd.find((n) => n.id === m.id)
            ),
          ]);
        }

        graph.nodeColor(graph.nodeColor());
      }

      function showBetweennessResults(results) {
        console.log("Betweenness sonuçları:", results);
      }

      function updateStats() {
        document.getElementById("statNodes").textContent =
          graphData.nodes.length;
        document.getElementById("statEdges").textContent =
          graphData.links.filter((l) => l.type === "reference").length;

        const totalOutRefs = graphData.nodes.reduce(
          (sum, n) => sum + n.outDegree,
          0
        );
        const totalInRefs = graphData.nodes.reduce(
          (sum, n) => sum + n.citationCount,
          0
        );

        document.getElementById("statOutRefs").textContent = totalOutRefs;
        document.getElementById("statInRefs").textContent = totalInRefs;

        if (graphData.nodes.length > 0) {
          const topCited = graphData.nodes.reduce((max, n) =>
            n.citationCount > max.citationCount ? n : max
          );
          document.getElementById(
            "statTopCited"
          ).textContent = `${topCited.id.slice(-8)} (${
            topCited.citationCount
          })`;

          const topReferencer = graphData.nodes.reduce((max, n) =>
            n.outDegree > max.outDegree ? n : max
          );
          document.getElementById(
            "statTopReferencer"
          ).textContent = `${topReferencer.id.slice(-8)} (${
            topReferencer.outDegree
          })`;
        }
      }

      initGraph();
    </script>
  </body>
</html>
